    - data:
        code: "import json\nimport re\n\n\ndef main(llm_text: str, action: str, turn:\
          \ float, grudge: float, favor: float) -> dict:\n    \"\"\"把玩家的行动变成确定的状态变化，并拼出要写进\
          \ PowerContext 的记忆。\"\"\"\n    say = \"\"\n    detail = \"\"\n    try:\n\
          \        match = re.search(r\"\\{.*\\}\", llm_text or \"\", re.S)\n    \
          \    if match:\n            data = json.loads(match.group(0))\n        \
          \    if isinstance(data, dict):\n                say = str(data.get(\"say\"\
          , \"\") or \"\").strip()\n                detail = str(data.get(\"detail\"\
          , \"\") or \"\").strip()\n    except Exception:\n        say = \"\"\n  \
          \      detail = \"\"\n\n    if not say:\n        say = (llm_text or \"\"\
          ).strip()[:400] or \"阿铁哼了一声，没再说话。\"\n    if not detail:\n        detail\
          \ = (action or \"见面\").strip()[:40]\n\n    action = (action or \"\").strip()\n\
          \    new_turn = int(turn) + 1\n    new_grudge = int(grudge)\n    new_favor\
          \ = int(favor)\n\n    if action == \"恶作剧\":\n        kind = \"prank_grudge\"\
          \n        new_grudge = max(-5, min(5, new_grudge + 1))\n        memory_text\
          \ = \"第{}回合，玩家对阿铁使坏：{}。阿铁记下了这笔账。\".format(new_turn, detail)\n    elif action\
          \ == \"帮忙\":\n        kind = \"help_favor\"\n        new_favor = max(0,\
          \ min(5, new_favor + 1))\n        new_grudge = max(-5, min(5, new_grudge\
          \ - 1))\n        memory_text = \"第{}回合，玩家帮了阿铁：{}。阿铁记着这份人情。\".format(new_turn,\
          \ detail)\n    else:\n        kind = \"encounter\"\n        memory_text\
          \ = \"第{}回合，玩家与阿铁：{}。\".format(new_turn, detail)\n\n    if new_grudge >=\
          \ 3:\n        attitude = \"死敌\"\n    elif new_grudge >= 1:\n        attitude\
          \ = \"记恨\"\n    elif new_grudge <= -3:\n        attitude = \"死忠\"\n    elif\
          \ new_grudge <= -1:\n        attitude = \"亲近\"\n    else:\n        attitude\
          \ = \"中立\"\n\n    if action == \"结束冒险\":\n        ending = \"\\n\\n【冒险结束】\"\
          \ + say\n        if attitude == \"死敌\":\n            ending += \"\\n（阿铁把锤子往铁砧上一摔：'这辈子别再让我看见你。'）\"\
          \n        elif attitude in (\"亲近\", \"死忠\"):\n            ending += \"\\\
          n（阿铁难得地笑了一下：'……下回再来，提前说一声。'）\"\n        else:\n            ending += \"\\\
          n（阿铁背过身去敲他的铁：'走吧。'）\"\n        say = ending\n\n    return {\n        \"\
          reply\": say,\n        \"detail\": detail,\n        \"memory_kind\": kind,\n\
          \        \"memory_text\": memory_text,\n        \"new_turn\": new_turn,\n\
          \        \"new_grudge\": new_grudge,\n        \"new_favor\": new_favor,\n\
          \        \"new_attitude\": attitude,\n    }\n"
