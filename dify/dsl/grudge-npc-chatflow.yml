    - data:
        code: "import json\nimport re\n\n\ndef _int(pattern, text, default=0):\n \
          \   match = re.search(pattern, text)\n    return int(match.group(1)) if\
          \ match else default\n\n\ndef main(entries_raw: str, prepared_raw: str)\
          \ -> dict:\n    \"\"\"从 PowerContext 的记忆条目里还原 NPC 状态与历史清单。\"\"\"\n    entries\
          \ = []\n    try:\n        data = json.loads(entries_raw)\n        if isinstance(data,\
          \ dict):\n            entries = data.get(\"entries\", []) or []\n    except\
          \ Exception:\n        entries = []\n\n    active = [e for e in entries if\
          \ isinstance(e, dict) and e.get(\"state\") == \"active\"]\n\n    history_lines\
          \ = []\n    best = None  # (turn, grudge, favor)\n    for entry in active:\n\
          \        kind = entry.get(\"kind\", \"\")\n        text = entry.get(\"text\"\
          , \"\") or \"\"\n        turn = _int(r\"第(\\s*\\d+)\\s*回合\", text)\n   \
          \     if kind == \"npc_state\":\n            grudge = _int(r\"记仇=(-?\\d+)\"\
          , text)\n            favor = _int(r\"恩情=(-?\\d+)\", text)\n            if\
          \ best is None or turn >= best[0]:\n                best = (turn, grudge,\
          \ favor)\n        elif kind in (\"prank_grudge\", \"help_favor\", \"encounter\"\
          ):\n            history_lines.append(text)\n\n    turn, grudge, favor =\
          \ best if best else (0, 0, 0)\n    turn = int(turn)\n    grudge = max(-5,\
          \ min(5, int(grudge)))\n    favor = max(0, min(5, int(favor)))\n\n    if\
          \ grudge >= 3:\n        attitude = \"死敌\"\n    elif grudge >= 1:\n     \
          \   attitude = \"记恨\"\n    elif grudge <= -3:\n        attitude = \"死忠\"\
          \n    elif grudge <= -1:\n        attitude = \"亲近\"\n    else:\n       \
          \ attitude = \"中立\"\n\n    prepared = \"\"\n    try:\n        prepared_data\
          \ = json.loads(prepared_raw)\n        if isinstance(prepared_data, dict):\n\
          \            prepared = prepared_data.get(\"content\", \"\") or \"\"\n \
          \   except Exception:\n        prepared = \"\"\n\n    return {\n       \
          \ \"turn\": turn,\n        \"grudge\": grudge,\n        \"favor\": favor,\n\
          \        \"attitude\": attitude,\n        \"history\": \"\\n\".join(history_lines[-6:]),\n\
          \        \"has_history\": \"true\" if history_lines else \"false\",\n  \
          \      \"prepared\": prepared,\n    }\n"
        code_language: python3
